<!DOCTYPE html>
<html>
    <head>
        <title>
            USB Forensics Dashboard
        </title>
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename= 'style.css') }}"
        >
    </head>
    
    <body>
        <div class="container">
            <h1>
                USB Threat Intelligence Dashboard
            </h1>
            <div class="stats">
                <div class="card">
                    <h2>Total Events</h2>
                    <p>{{ total_events }}</p>
                </div>
                
                <div class="card">
                    <h2>High Risk Events</h2>
                    <p>{{ high_risk }}</p>
                </div>
            </div>

            <h2>
                Forensic Logs
            </h2>

            <table>
                <tr>
                    <th>Timestamp</th>
                    <th>Event</th>
                    <th>File</th>
                    <th>Risk</th>
                    <th>Reason</th>
                </tr>

                {% for log in logs %}

                <tr>
                    <td>{{ log[0] }}</td>
                    <td>{{ log[1] }}</td>
                    <td>{{ log[2] }}</td>
                    <td>{{ log[3] }}</td>
                    <td>{{ log[4] }}</td>
                </tr>

                {% endfor %}
            </table>
        </div>
    </body>
</html>
